name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safe-tests:
    name: Safe tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install npm dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app scripts
      - name: Python tests
        env:
          SCENE_FIRST_PUBLIC_MODE: ""
          SCENE_FIRST_LOCAL_MASTER: ""
          SCENE_FIRST_POSE_AVATAR_OVERLAY: ""
        run: python -m pytest -q
      - name: Cloudflare TypeScript typecheck
        run: npm run cf:typecheck
      - name: Validate generic avatar schema
        run: python scripts/validate_pose_avatar_family.py assets/avatar_families/generic
      - name: Verify deterministic placeholder assets
        run: python scripts/generate_public_placeholders.py --check

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_VERSION: 8.30.1
